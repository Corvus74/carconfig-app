<button
  class="grid-item slide bg-light"
  [class.selected]="isSelected()"
  (click)="selectCarEngine()"
  onKeyDown="selectCarEngine();"
>

  <div class="container text-center">
    <div class="row">
      <div class="border border-primary col image-content">
        <div class="imageText">Image of engine</div>
        <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" width="4vw" height="4vh">
          <circle r="245" cx="400" cy="400" fill="#7FDB70" stroke="#41B82E" stroke-width="10"/>
        </svg>
      </div>
    </div>
    <div class="row">
      <div class="title">{{ value()?.model }}</div>
    </div>
  </div>
  <div class="container text-lg-start">
    <div class="row">
      <div class=" col">
        <div class="label-small">Fuel Type:</div>
      </div>
      <div class=" col">
        <div class="description">{{ value()?.fuelType }}</div>
      </div>
    </div>
    <div class="row">
      <div class=" col">
        <div class="label-small">Engine Type:</div>
      </div>
      <div class=" col">
        <div class="description">{{ value()?.engineType }}</div>
      </div>
    </div>
    <div class="row">
      <div class=" col">
        <div class="label-small">Displacement (l):</div>
      </div>
      <div class=" col">
        <div class="description">{{ value()?.displacementL }}</div>
      </div>
    </div>
    <div class="row">
      <div class=" col">
        <div class="label-small">Cylinders (l):</div>
      </div>
      <div class=" col">
        <div class="description">{{ value()?.cylinders }}</div>
      </div>
    </div>
    <div class="row">
      <div class=" col">
        <div class="label-small">Horsepower (l):</div>
      </div>
      <div class=" col">
        <div class="description">{{ value()?.horsepowerKw }}</div>
      </div>
    </div>
    <div class="row">
      <div class=" col">
        <div class="label-small">Torqe (Nm):</div>
      </div>
      <div class=" col">
        <div class="description">{{ value()?.torqueNm }}</div>
      </div>
    </div>
    <div class="row">
      <div class=" col">
        <div class="label-small">Drivetrain:</div>
      </div>
      <div class=" col">
        <div class="description">{{ value()?.drivetrain }}</div>
      </div>
    </div>
    <div class="row">
      <div class=" col">
        <div class="label-small">CO2 Emmisions:</div>
      </div>
      <div class=" col">
        <div class="description">{{ value()?.co2 }}</div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="label-small">Price:</div>
      </div>
      <div class="col">
        <div class="description">{{ toCurrencyFormat(value()?.price) }}</div>
      </div>
      <div class="row">
        <div class="col">
        </div>
        <div class="col">
          <button (click)="handleIconClick($event)" class="button-info bg-transparent border-none text-gray-500 hover:text-blue-500 transition-colors duration-200">
            <i class="bi bi-info-circle text-4xl"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</button>

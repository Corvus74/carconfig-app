<div class="row bg-body bg-dark">
  <div class="card shadow-sm">
    <div class="card-header bg-dark d-flex justify-content-between align-items-center p-0 text-light"
         (click)="showCategoryMenu()"
         (keydown.enter)="showCategoryMenu()"
         tabindex="0"
         role="button"
         [attr.aria-expanded]="categoryMenuShown"
         style="cursor: pointer;">
      <h5 class="mb-0 d-flex align-items-center">
        <i class="ri-truck-line me-2"></i>
        {{ titleName }}
      </h5>
      <i class="bi fs-5 me-2"
         [class.bi-chevron-down]="!categoryMenuShown"
         [class.bi-chevron-up]="categoryMenuShown"
         aria-hidden="true"></i>
    </div>
  </div>
  @if (categoryMenuShown) {

    <div #container class="overflow-auto header-equipment" tabindex="0" role="region"
         [attr.aria-label]="titleName + ' list'">
      <ul class="list-unstyled d-flex flex-row gap-2 m-0 p-0">
        @for (item of specialEquipmentListInit; track item.productId) {
          <li class="d-flex">
            <button type="button"
                    class="btn btn-light d-flex align-items-center gap-2 border rounded-3 p-2 shadow-sm"
                    (click)="onSelectItem(item)">
              <!-- Toggle-Marker links -->
              <span class="d-inline-block rounded-circle border flex-shrink-0"
                    style="width:20px;height:20px;">
          @if (isSelectedAndNotDoubleByCategory(item)) {
            <span class="d-inline-block rounded-circle bg-primary"
                  style="width:100%;height:100%;"> </span>
          }
        </span>

              <app-car-config-equipment-menu-item
                [title]="item.equipmentName"
                [description]="item.description"
                [specialEquipment]="item"
                [isSelected]="isSelectedAndNotDoubleByCategory(item)">
              </app-car-config-equipment-menu-item>
            </button>
          </li>
        }
      </ul>

    </div>
    <div class="btn-group btn-group-sm" role="group" aria-label="Scroll controls">
      <button type="button" class="btn btn-outline-secondary" (click)="scroll('left')" aria-label="Scroll left">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="scroll('right')" aria-label="Scroll right">
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>

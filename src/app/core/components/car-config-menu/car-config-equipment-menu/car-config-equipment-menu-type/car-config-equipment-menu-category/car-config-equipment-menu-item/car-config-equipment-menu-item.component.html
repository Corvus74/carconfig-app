<!-- Kleines Bild/Platzhalter-Icon links -->
<span class="d-inline-flex align-items-center justify-content-center border rounded bg-light flex-shrink-0"
      style="width:36px;height:36px;">
          <i class="bi bi-image" aria-hidden="true"></i>
        </span>
<div class=" grid-container">

  <div class="container text-center">
    <div class="row">
      <div class="col">
        <div class="container text-center">
          <div class="row">
            <div class="col">
              {{ specialEquipment?.equipmentName }}
            </div>
          </div>
          <div class="row">
            <div class="col">
              {{ toCurrencyFormat(specialEquipment?.price) }}
            </div>
            <div class="col">
              <button (click)="handleIconClick($event)"
                      class="button-info bg-transparent border-none text-gray-500 hover:text-blue-500 transition-colors duration-200">
                <i class="bi bi-info-circle text-4xl"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

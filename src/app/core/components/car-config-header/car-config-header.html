

<header class="bg-dark text-white py-3 shadow-lg rounded-b-lg">
  <div class="container-fluid">
    <!-- Main row for the five columns -->
    <div class="row align-items-center">
      <!-- Column 1: Company Logo -->
      <div class="col-auto">
        <img
          ngSrc="./assets/logo.jpg"
          alt="Company Logo"
          class="img-fluid rounded shadow logo"
          placeholder
        />
      </div>

      <div class="col-md d-none d-md-block"></div>

      <div class="col-12 col-md-auto">
        <div class="d-flex flex-column flex-md-row align-items-center justify-content-end">

          <div class="me-md-4 mb-2 mb-md-0">
            <label for="username" class="form-label text-secondary fw-bold">Username</label>
            <input type="text" id="username" class="form-control form-control-sm" placeholder="Enter username">
          </div>


          <div class="me-md-4 mb-2 mb-md-0">
            <label for="email" class="form-label text-secondary fw-bold">Email</label>
            <input type="email" id="email" class="form-control form-control-sm" placeholder="Enter email">
          </div>


          <button
            type="button"
            class="btn btn-primary rounded-pill shadow-lg"
            (click)="onButtonClick()">
            Settings
          </button>
          <div class="btn-groupmt-4" role="group" aria-label="Callout buttons">
            <button type="button" class="btn btn-primary btn-lg" data-toggle="modal" data-target="#register">Register Now</button>
            <a class="btn btn-light btn-lg" href="#speakers">See Speakers</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

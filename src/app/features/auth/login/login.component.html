<div class="login-container">
  <!-- Hintergrund-Glow-Effekte -->
  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>
  <form [formGroup]="form" (ngSubmit)="onLogin()" class="login-card">

    <!-- Logo & Header (Zentriert) -->
    <div class="login-header">
      <div class="logo-wrapper">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="login-title">Willkommen zurück</h1>
      <p class="login-subtitle">Melde dich an, um fortzufahren</p>
    </div>
    <!-- E-Mail Feld -->
    <div class="form-group">
      <label for="email">E-Mail-Adresse</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input id="email" type="email" formControlName="email" placeholder="name@beispiel.de" autocomplete="email">
      </div>
      @if (emailControl.invalid && emailControl.touched) {
        <div class="error-message">Bitte eine gültige E-Mail-Adresse eingeben.</div>
      }
    </div>
    <!-- Passwort Feld -->
    <div class="form-group">
      <label for="password">Passwort</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      @if (passwordControl.invalid && passwordControl.touched) {
        <div class="error-message">Passwort darf nicht leer sein.</div>
      }
    </div>
    <!-- Globaler Fehler -->
    @if (errorMessage()) {
      <div class="error-message global-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="error-icon">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }
    <!-- Submit Button -->
    <button type="submit" [disabled]="form.invalid" class="login-button">
      <span>Anmelden</span>
      <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </form>
</div>

name: CD - Publish to GHCR

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  GHCR_IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: 'Publish to GitHub Container Registry'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permission to write to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and run tests
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: |
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadless

      - name: Convert repository name to lower-case
        id: repo-case
        run: echo "repo_lc=$(echo ${{ env.GHCR_IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-case.outputs.repo_lc }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI - Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  ci_validation:
    name: 'Build, Test, and Validate Dockerfile'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Run Angular tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for validation
        uses: docker/build-push-action@v5
        with:
          context: .
          # We only build the image to validate the Dockerfile. We don't push it.
          push: false
          # 'load: true' makes the image available to subsequent steps if needed,
          # but is mainly here to ensure the build completes.
          load: true
          # Use the GitHub Actions cache for Docker layers to speed up builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

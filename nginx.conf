server {
    listen 8080;
    server_name localhost;

    # The root directory where your Angular app's files are located.
    root /usr/share/nginx/html;
    index index.html;

    # Include mime types to ensure files like .js are served correctly.
    include /etc/nginx/mime.types;

    # Turn off access logs for less noise.
    access_log off;
    error_log /dev/stderr warn;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Enable Gzip compression for better performance.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/ttf font/otf image/svg+xml application/wasm;

    # Healthcheck endpoint for the Dockerfile HEALTHCHECK / Render.com
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Runtime configuration is generated in /tmp by the unprivileged entrypoint.
    location = /assets/env.js {
        alias /tmp/env.js;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Never cache index.html, otherwise browsers/CDNs may serve stale
    # references to old JS/CSS chunks after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # This is the key for single-page applications (SPAs) like Angular.
    # It ensures that any deep link is redirected to index.html for the Angular router to handle.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Add aggressive caching headers for static assets.
    # The 'immutable' directive tells browsers they don't need to revalidate these files.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

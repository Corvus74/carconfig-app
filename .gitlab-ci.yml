# This GitLab CI/CD configuration is optimized for a modern Angular project
# with a multi-stage Dockerfile. It follows best practices for testing and building.

stages:
  - test
  - build

variables:
  # Define Docker images centrally for easy updates.
  # Using the official Docker-in-Docker (dind) service.
  DOCKER_IMAGE: docker:27.2.0
  DOCKER_DIND_IMAGE: docker:27.2.0-dind
  # Define the final image name using GitLab's predefined variables.
  IMAGE_NAME: $CI_REGISTRY_IMAGE

# This global cache speeds up dependency installation in the 'test' job.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull

# The 'test' job ensures code quality before any build is attempted.
# It runs on all branches and merge requests, but not on tags.
test:
  stage: test
  image: node:20-alpine
  # Cache node_modules specifically for this job to speed up subsequent test runs.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push
  script:
    - echo "Installing dependencies..."
    - npm ci --cache .npm --prefer-offline
    - echo "Running Angular tests..."
    - npm run test -- --watch=false --browsers=ChromeHeadless
  rules:
    # Don't run for tags, as the code has already been tested on the branch.
    - if: $CI_COMMIT_TAG
      when: never
    # Run for all other cases (branches, merge requests).
    - when: on_success

# The 'build_and_push' job creates and publishes the Docker image.
# It only runs if the 'test' job succeeds.
build_and_push:
  stage: build
  image: $DOCKER_IMAGE
  services:
    - name: $DOCKER_DIND_IMAGE
      alias: docker
  variables:
    # Configure Docker to use the dind service.
    DOCKER_HOST: tcp://docker:2375
    # Disable TLS for the dind service within the CI job.
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: test
  script:
    - echo "Logging into GitLab Container Registry: $CI_REGISTRY"
    # Use the predefined CI_REGISTRY_PASSWORD for authentication.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Determine the image tag. Use the Git tag if it exists, otherwise use the commit SHA.
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        TAG=$CI_COMMIT_TAG
        echo "Building for Git tag: $TAG"
      else
        TAG=$CI_COMMIT_SHORT_SHA
        echo "Building for branch '$CI_COMMIT_REF_NAME' with commit SHA: $TAG"
      fi
    # Build the Docker image using the project's Dockerfile.
    # The multi-stage Dockerfile handles the entire build process, ensuring a reproducible artifact.
    - echo "Building image: $IMAGE_NAME:$TAG"
    - docker build --pull -t "$IMAGE_NAME:$TAG" -t "$IMAGE_NAME:latest" .
    # Push the tagged image and the 'latest' tag to the registry.
    - echo "Pushing image: $IMAGE_NAME:$TAG"
    - docker push "$IMAGE_NAME:$TAG"
    - echo "Pushing image: $IMAGE_NAME:latest"
    - docker push "$IMAGE_NAME:latest"
  rules:
    # Run this job only for pushes to the default branch (e.g., 'main').
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Or, run this job for any Git tag that is pushed.
    - if: $CI_COMMIT_TAG

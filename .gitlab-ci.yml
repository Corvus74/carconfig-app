stages:
  - install
  - test
  - build
  - docker

variables:
  # Speeds up npm installs in CI
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Use Docker-in-Docker
  DOCKER_DRIVER: overlay2

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/

install:
  image: node:20-alpine
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 2h

test:
  image: node:20-alpine
  stage: test
  needs: ["install"]
  script:
    - npm run test -- --watch=false --browsers=ChromeHeadless
  rules:
    - if: $CI_COMMIT_BRANCH

build-angular:
  image: node:20-alpine
  stage: build
  needs: ["install"]
  script:
    # Adjust --configuration if you have specific environments
    - npm run build -- --configuration production
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

docker-build:
  stage: docker
  image: docker:27.2.0
  services:
    - name: docker:27.2.0-dind
      command: ["--tls=false", "--mtu=1460"]
  needs: ["build-angular"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Logging into GitLab container registry"
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - IMAGE_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG


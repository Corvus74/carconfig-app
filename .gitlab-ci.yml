# GitLab CI validates the Angular app and Docker image on every branch.
# Images are pushed only from the default branch and tags.

stages:
  - test
  - build

variables:
  DOCKER_IMAGE: docker:29.6.2
  DOCKER_DIND_IMAGE: docker:29.6.2-dind
  IMAGE_NAME: $CI_REGISTRY_IMAGE

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull

test:
  stage: test
  image: node:24.18.0-bookworm
  variables:
    CHROME_BIN: /usr/local/bin/chromium-headless
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push
  script:
    - apt-get update && apt-get install -y --no-install-recommends chromium && rm -rf /var/lib/apt/lists/*
    - printf '#!/bin/sh\nexec /usr/bin/chromium --no-sandbox --disable-dev-shm-usage "$@"\n' > "$CHROME_BIN"
    - chmod +x "$CHROME_BIN"
    - npm ci --cache .npm --prefer-offline
    - npm run test -- --watch=false --browsers=ChromeHeadless
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

build_and_validate:
  stage: build
  image: $DOCKER_IMAGE
  services:
    - name: $DOCKER_DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: test
      optional: true
  script:
    - |
      TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      echo "Building image: ${IMAGE_NAME}:${TAG}"
      docker build --pull -t "${IMAGE_NAME}:${TAG}" .

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "${IMAGE_NAME}:${TAG}"

        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          docker tag "${IMAGE_NAME}:${TAG}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
        fi
      fi
  rules:
    - when: on_success

<app-car-config-header></app-car-config-header>
<div class="container-fluid d-flex justify-content-end py-2">
  <a class="btn btn-outline-primary btn-sm" routerLink="/user-management">{{ 'app.userManagement' | transloco }}</a>
</div>
<div class="card">
  <div class="card-body">
    <div class="container text-center">
      <div class="row">
        @if (checkoutState.orderReviewMode()) {
          <div class="col">
            <app-checkout-view [showOrderMenu]="true"></app-checkout-view>
          </div>
          <div class="col">
            <app-3d-car-view></app-3d-car-view>
            <app-car-information></app-car-information>
          </div>
        } @else {
          <div class="col">
            <app-menu></app-menu>
          </div>
          <div class="col">
            <app-3d-car-view></app-3d-car-view>
            <app-car-information></app-car-information>
          </div>
        }
      </div>
    </div>
  </div>
</div>

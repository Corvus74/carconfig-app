<article class="color-card" [class.selected]="isSelected()">
  <button type="button" class="color-select" [attr.aria-pressed]="isSelected()"
    [attr.aria-label]="('colors.select' | transloco) + ': ' + (value()?.colorName || ('config.paint' | transloco))" (click)="onClick()">
    <span class="swatch-wrap">
      <app-car-config-colorview-circle [fillColor]="colorCodeHex"
        [materialType]="value()?.materialType"></app-car-config-colorview-circle>
      @if (isSelected()) {
        <span class="selected-mark" aria-hidden="true"><i class="bi bi-check-lg"></i></span>
      }
    </span>
    <strong class="color-name">{{ value()?.colorName || ('config.paint' | transloco) }}</strong>
    <span class="paint-type">{{ (value()?.materialType === CarColorDto.MaterialTypeEnum.Matte ? 'colors.matteLabel' : 'colors.glossy') | transloco }}</span>
    <span class="color-price">
      @if (priceIsAvailable(value())) {
        {{ toCurrencyFormat(value()?.price) }}
      } @else {
        {{ 'common.included' | transloco }}
      }
    </span>
  </button>
  @if (value()?.description) {
    <button type="button" class="info-button" [attr.aria-label]="'colors.info' | transloco" (click)="handleIconClick($event)">
      <i class="bi bi-info-circle" aria-hidden="true"></i><span>{{ 'common.details' | transloco }}</span>
    </button>
  }
</article>
